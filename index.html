<!doctype html>
<html lang="de" data-welt="sie">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#241019">
  <title>Hörbuch-Cockpit</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/basis.css">
  <link rel="stylesheet" href="css/welt-sie.css">
  <link rel="stylesheet" href="css/welt-er.css">
</head>
<body>
  <header class="kopf">
    <div class="kopf-oben">
      <p class="gruss" id="gruss"></p>
      <button class="profil-schalter" id="profil-schalter" hidden></button>
    </div>
    <p id="stand" class="stand"></p>
  </header>
  <nav class="springe" id="springe" aria-label="Bereiche">
    <div class="springe-inner">
      <a href="#entdecken">Für dich</a>
      <a href="#suche">Suchen</a>
      <a href="#merkliste-bereich">Merkliste</a>
      <a href="#bibliothek">Bibliothek</a>
    </div>
  </nav>
  <main>
    <section id="entdecken" aria-label="Für dich gefunden"></section>
    <section id="suche" aria-label="Finde etwas Neues"></section>
    <section id="merkliste-bereich" aria-label="Deine Merkliste"></section>
    <section id="malwieder" aria-label="Mal wieder hören"></section>
    <section id="bibliothek" aria-label="Deine Bibliothek"></section>
  </main>
  <footer class="fuss"><span id="sync-status"></span></footer>
  <script type="module" src="js/app.js"></script>
</body>
</html>
